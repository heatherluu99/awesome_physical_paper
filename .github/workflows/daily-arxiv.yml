name: Daily arXiv tracker

on:
  schedule:
    # 01:30 UTC (09:30 Beijing time). arXiv announces new papers around 00:00 UTC (Sun-Thu).
    - cron: "30 1 * * *"
  workflow_dispatch:
    inputs:
      max_new:
        description: "Max number of new papers to analyse in this run"
        default: "50"
      fetch_multiplier:
        description: "Fetch-size multiplier (raise it, e.g. to 5, to backfill history)"
        default: "1"

permissions:
  contents: write

concurrency:
  group: daily-arxiv
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Fetch, analyse and render
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          MAX_NEW_PER_RUN: ${{ inputs.max_new }}
          FETCH_MULTIPLIER: ${{ inputs.fetch_multiplier }}
        run: python -m tracker

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md data archive assets
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "chore: daily arXiv update $(date -u +%F)"
            git push
          fi
